<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="refresh" content="300">
<title>CoinGlass 涨幅榜监控</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #0f1419;
    color: #e8e8e8;
    min-height: 100vh;
    padding: 12px;
}
.header {
    text-align: center;
    padding: 16px 0 20px;
}
.header h1 {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, #f7931a, #ff6b6b);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
}
.header .time {
    font-size: 13px;
    color: #8899a6;
}
.header .refresh {
    font-size: 11px;
    color: #5c6c7c;
    margin-top: 4px;
}
.coin-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.coin-row {
    background: #1a2332;
    border-radius: 12px;
    padding: 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-left: 3px solid #2a3a4a;
}
.rank {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    background: #2a3a4a;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
}
.rank-top {
    background: linear-gradient(135deg, #f7931a, #ff6b35);
    color: #fff;
}
.coin-info { flex: 1; min-width: 0; }
.coin-name {
    font-size: 16px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
}
.coin-price {
    font-size: 13px;
    color: #8899a6;
    margin-top: 2px;
}
.coin-duration {
    font-size: 11px;
    color: #60a5fa;
    margin-top: 3px;
    font-weight: 500;
}
.badge {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 500;
}
.badge.new { background: #1a5f3f; color: #4ade80; }
.badge.keep { background: #1e3a5f; color: #60a5fa; }
.metrics {
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: right;
    flex-shrink: 0;
}
.metric { display: flex; flex-direction: column; }
.metric .label { font-size: 10px; color: #5c6c7c; }
.metric .value { font-size: 14px; font-weight: 600; }
.up { color: #ff4d4f; }
.down { color: #52c41a; }
.time-info { display: none; }
.dropped {
    background: #2a1a1a;
    border: 1px solid #4a2a2a;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
    color: #ff7875;
    margin-top: 12px;
}
.stats-section {
    background: #1a2332;
    border-radius: 12px;
    padding: 14px;
    margin-top: 12px;
}
.stats-title {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #d0d0d0;
}
.stat-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    border-bottom: 1px solid #2a3a4a;
    font-size: 13px;
}
.stat-item:last-child { border-bottom: none; }
.stat-symbol { font-weight: 600; }
.stat-gain { font-weight: 600; }
.stat-rank { color: #8899a6; font-size: 12px; }
.footer {
    text-align: center;
    padding: 20px 0 10px;
    font-size: 11px;
    color: #5c6c7c;
}
@media (min-width: 600px) {
    body { max-width: 700px; margin: 0 auto; }
    .coin-duration { display: none; }
    .time-info {
        display: flex;
        flex-direction: column;
        gap: 2px;
        text-align: right;
        flex-shrink: 0;
    }
    .time-item { display: flex; flex-direction: column; }
    .time-item .label { font-size: 10px; color: #5c6c7c; }
    .time-item .val { font-size: 11px; color: #8899a6; }
}
</style>
</head>
<body>
<div class="header">
    <h1>🔥 CoinGlass 涨幅榜监控</h1>
    <div class="time">更新时间: 2026-09-17 09:59:46</div>
    <div class="refresh">页面每 5 分钟自动刷新 · 云端每小时更新</div>
</div>
<div class="coin-list">
    
</div>
<div class="dropped">📉 本轮掉出 Top10: SYN, BR, BULLA, FOLD, DELTA, KNOTS, ONE, HOOKR, ZCAT, STONK</div>

<div class="footer">
    数据来源: CoinGlass · GitHub Actions 每小时自动监控 · 24h 涨幅榜 Top10
</div>
</body>
</html>
