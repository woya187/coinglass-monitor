<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="300">
<title>CoinGlass 涨幅榜监控</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#0f1419;color:#e8e8e8;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0}
.container{text-align:center;padding:20px}
h1{color:#f7931a;font-size:24px}
p{color:#8899a6;font-size:14px;line-height:1.8}
.spinner{border:3px solid #2a3a4a;border-top-color:#f7931a;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
<h1>🔥 CoinGlass 涨幅榜监控</h1>
<div class="spinner"></div>
<p>正在初始化数据...</p>
<p>首次运行约需 2-3 分钟，页面每 5 分钟自动刷新</p>
<p>如长时间未更新，请前往仓库 Actions 页面查看运行状态</p>
</div>
</body>
</html>
